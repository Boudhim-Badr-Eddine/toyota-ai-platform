name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toyota-ai-platform

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: toyota-ai-platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/toyota
          DIRECT_URL: postgresql://user:pass@localhost:5432/toyota
          NEXTAUTH_SECRET: ci-secret-min-32-chars-long-xxxxx
          NEXTAUTH_URL: http://localhost:3000
          GROQ_API_KEY: sk-ci-placeholder
